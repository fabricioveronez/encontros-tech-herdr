services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-encontros_tech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-encontros_tech}
      POSTGRES_DB: ${POSTGRES_DB:-encontros_tech}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-encontros_tech}:${POSTGRES_PASSWORD:-encontros_tech}@db:5432/${POSTGRES_DB:-encontros_tech}
      # Com banco vazio, 2+ workers disputam o create_all no boot (design R2)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "${PORT:-8000}:8000"
